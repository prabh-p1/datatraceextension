<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataTrace</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">DataTrace</span>
    </div>
    <span class="brand-tag">evidence, not opinions</span>
  </header>

  <section class="composer">
    <textarea id="claim-input" placeholder="Paste or type a claim to verify…" rows="3"></textarea>
    <button id="trace-btn" class="primary">put the claim to the test</button>
  </section>

  <section id="status" class="status" hidden>
    <div class="status-dot"></div>
    <div class="status-text-wrap">
      <div id="status-text" class="status-text">Submitting claim…</div>
      <div id="status-sub" class="status-sub"></div>
    </div>
  </section>

  <section id="result" class="result" hidden>
    <div class="score-row">
      <div class="score-block">
        <div id="score" class="score numeric">—</div>
        <div class="score-label">TraceScore</div>
      </div>
      <div class="verdict-block">
        <div id="verdict" class="verdict"></div>
        <div class="stability-row">
          <span class="stability-label">stability</span>
          <span id="stability" class="stability" data-tone="low">LOW</span>
        </div>
      </div>
    </div>

    <p id="summary" class="summary"></p>

    <ul id="findings" class="findings"></ul>

    <div class="meta-row">
      <span id="sources" class="meta numeric"></span>
    </div>

    <a id="open-full" class="open-full" target="_blank" rel="noopener">
      Open full report
      <span class="arrow">↗</span>
    </a>
  </section>

  <footer class="footnote">
    DataTrace runs the same evidence engine on the server. Deep-dive the
    proof graph, coverage certificate, and evidence lab in the full report.
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
